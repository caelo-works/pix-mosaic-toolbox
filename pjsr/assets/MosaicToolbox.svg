<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Mosaic Toolbox">
  <!-- Mosaic Toolbox: four plate-solved tiles reprojected onto one common grid.
       The tiles overlap slightly, the way real mosaic tiles do, and the seams
       are where the photometric join happens. Each tile carries a narrowband
       tint (S / H / O / L) so the icon reads as a multi-filter assembly. -->
  <defs>
    <linearGradient id="mtField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#mtField)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- four overlapping tiles on the common grid -->
  <g opacity="0.92">
    <rect x="12"   y="12"   width="22" height="22" rx="2.5" fill="#f59e0b" opacity="0.85"/>
    <rect x="30"   y="12"   width="22" height="22" rx="2.5" fill="#f87171" opacity="0.85"/>
    <rect x="12"   y="30"   width="22" height="22" rx="2.5" fill="#22d3ee" opacity="0.85"/>
    <rect x="30"   y="30"   width="22" height="22" rx="2.5" fill="#60a5fa" opacity="0.85"/>
  </g>

  <!-- the join seams the script matches across -->
  <g stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
    <line x1="32" y1="13" x2="32" y2="51"/>
    <line x1="13" y1="32" x2="51" y2="32"/>
  </g>

  <!-- the single common grid the whole thing is reprojected onto -->
  <rect x="12" y="12" width="40" height="40" rx="3" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.9"/>
</svg>
